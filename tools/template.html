<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root{
    --ground:#131619; --panel:#1B1F23; --raise:#22272C; --edge:#2C3238;
    --ink:#E6E9EB; --muted:#89929A; --amber:#E2833C; --amber-dim:#8A5426;
    --sans:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--ground); color:var(--ink);
    font-family:var(--sans); font-size:16px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1400px; margin:0 auto; padding:0 24px 140px}

  /* ---- header ---- */
  header{
    border-bottom:1px solid var(--edge); background:var(--ground);
    padding:40px 0 26px; margin-bottom:32px;
  }
  .eyebrow{
    font-family:var(--mono); font-size:11px; font-weight:500;
    letter-spacing:.16em; text-transform:uppercase; color:var(--amber);
    margin:0 0 14px;
  }
  h1{
    font-size:clamp(28px,4vw,42px); font-weight:600; line-height:1.1;
    letter-spacing:-.02em; margin:0 0 16px; text-wrap:balance;
  }
  .lede{max-width:62ch; margin:0 0 22px; color:var(--muted); font-size:17px}
  .note{
    max-width:62ch; margin:0; padding:14px 16px;
    background:var(--panel); border-left:2px solid var(--amber);
    font-size:15px;
  }
  .meta{
    display:flex; flex-wrap:wrap; gap:28px; margin-top:24px;
    font-family:var(--mono); font-size:12px; color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .meta b{color:var(--ink); font-weight:500}

  /* ---- grid ---- */
  .grid{
    display:grid; gap:18px;
    grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  }
  .frame{margin:0; position:relative}
  .shot{
    display:block; width:100%; padding:0; border:1px solid var(--edge);
    border-radius:2px; background:var(--panel); cursor:pointer; overflow:hidden;
    transition:border-color .12s ease;
  }
  .shot img{display:block; width:100%; aspect-ratio:4/3; object-fit:cover}
  .shot:hover{border-color:var(--muted)}
  .shot:focus-visible,.zoom:focus-visible{outline:2px solid var(--amber); outline-offset:2px}
  .frame[data-on] .shot{border-color:var(--amber); box-shadow:0 0 0 2px var(--amber-dim)}
  .frame[data-on] .shot img{opacity:.82}

  .zoom{
    position:absolute; top:6px; right:6px; width:26px; height:26px;
    border:none; border-radius:2px; background:rgba(19,22,25,.78);
    color:var(--ink); font-size:13px; line-height:0; cursor:pointer; display:grid; place-items:center;
    opacity:0; transition:opacity .12s ease;
  }
  .frame:hover .zoom,.zoom:focus-visible{opacity:1}

  figcaption{
    display:flex; justify-content:space-between; align-items:baseline; gap:8px;
    padding:7px 2px 0; font-family:var(--mono); font-size:12px;
  }
  .code{font-weight:600; letter-spacing:.04em}
  .frame[data-on] .code{color:var(--amber)}
  .src{color:var(--muted); font-size:10px; letter-spacing:.06em; text-transform:uppercase}

  /* ---- tally ---- */
  .tally{
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    background:var(--panel); border-top:1px solid var(--edge);
    padding:14px 24px;
  }
  .tally-in{
    max-width:1400px; margin:0 auto; display:flex; align-items:center;
    gap:16px; flex-wrap:wrap;
  }
  .n{
    font-family:var(--mono); font-size:13px; font-variant-numeric:tabular-nums;
    color:var(--muted); white-space:nowrap;
  }
  .n b{color:var(--amber); font-weight:600}
  #picks{
    flex:1 1 320px; min-width:0; padding:9px 12px;
    background:var(--ground); border:1px solid var(--edge); border-radius:2px;
    color:var(--ink); font-family:var(--mono); font-size:13px;
  }
  .btn{
    padding:9px 16px; border:1px solid var(--edge); border-radius:2px;
    background:var(--raise); color:var(--ink);
    font-family:var(--sans); font-size:14px; cursor:pointer; white-space:nowrap;
  }
  .btn:hover{border-color:var(--muted)}
  .btn.primary{background:var(--amber); border-color:var(--amber); color:#14100C; font-weight:500}

  /* ---- lightbox ---- */
  dialog{
    border:none; padding:0; background:transparent; max-width:94vw; max-height:94vh;
  }
  dialog::backdrop{background:rgba(10,12,14,.94)}
  dialog img{display:block; max-width:94vw; max-height:84vh; object-fit:contain}
  .lb-bar{
    display:flex; justify-content:space-between; align-items:center; gap:16px;
    padding:10px 2px 0; font-family:var(--mono); font-size:13px; color:var(--muted);
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <p class="eyebrow">Contact sheet &middot; {{HINT}}</p>
    <h1>{{TITLE}}</h1>
    <p class="lede">{{LEDE}}</p>
    <p class="note">{{NOTE}}</p>
    <p class="meta">
      <span><b>{{COUNT}}</b> frames</span>
      <span>Click a frame to mark it</span>
      <span>Corner button enlarges</span>
      <span>Codes collect in the bar below</span>
    </p>
  </header>

  <div class="grid">
{{FRAMES}}
  </div>
</div>

<div class="tally">
  <div class="tally-in">
    <span class="n"><b id="cnt">0</b> selected</span>
    <input id="picks" readonly value="" placeholder="Your selections will appear here">
    <button class="btn primary" id="copy">Copy codes</button>
    <button class="btn" id="clear">Clear</button>
  </div>
</div>

<dialog id="lb">
  <img id="lbimg" alt="">
  <div class="lb-bar"><span id="lbcode"></span><span>Press Esc to close</span></div>
</dialog>

<script>
(function(){
  var picked = [];
  var out = document.getElementById('picks');
  var cnt = document.getElementById('cnt');
  var lb  = document.getElementById('lb');

  function sync(){
    cnt.textContent = picked.length;
    out.value = picked.join(', ');
  }

  document.querySelectorAll('.frame').forEach(function(f){
    var code = f.dataset.code;
    f.querySelector('.shot').addEventListener('click', function(){
      var i = picked.indexOf(code);
      if (i > -1){ picked.splice(i,1); delete f.dataset.on; this.setAttribute('aria-pressed','false'); }
      else { picked.push(code); f.dataset.on = ''; this.setAttribute('aria-pressed','true'); }
      sync();
    });
    f.querySelector('.zoom').addEventListener('click', function(){
      document.getElementById('lbimg').src = f.querySelector('img').src;
      document.getElementById('lbcode').textContent = code;
      lb.showModal();
    });
  });

  lb.addEventListener('click', function(e){ if (e.target === lb) lb.close(); });

  document.getElementById('copy').addEventListener('click', function(){
    out.select();
    if (navigator.clipboard) navigator.clipboard.writeText(out.value).catch(function(){});
    else { try { document.execCommand('copy'); } catch(e){} }
    var b = this, t = b.textContent;
    b.textContent = 'Copied';
    setTimeout(function(){ b.textContent = t; }, 1200);
  });

  document.getElementById('clear').addEventListener('click', function(){
    picked = [];
    document.querySelectorAll('.frame[data-on]').forEach(function(f){
      delete f.dataset.on;
      f.querySelector('.shot').setAttribute('aria-pressed','false');
    });
    sync();
  });
})();
</script>
